<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planificador">
<title>Planificador Docente 2026/2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><img src="logo.png" alt="CNC"><div><strong>Planificador Docente</strong><span>2026 / 2027</span></div></div>
    <nav id="desktopNav"></nav>
    <div class="sidebar-footer"><button class="ghost" data-action="installHelp">Instalar / privacidade</button></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">Colégio Novo de Coimbra</div><h1 id="viewTitle">Painel</h1></div>
      <div class="top-actions"><button class="icon-btn" data-action="theme" title="Tema">◐</button><button class="primary" data-action="quickToday">Hoje</button></div>
    </header>
    <section id="content" class="content"></section>
  </main>
  <nav id="mobileNav" class="mobile-nav"></nav>
</div>
<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="modal-backdrop" data-action="closeModal"></div>
  <div class="modal-panel"><button class="modal-close" data-action="closeModal">×</button><div id="modalContent"></div></div>
</div>
<div id="toast" class="toast"></div>
<input type="file" id="backupInput" accept=".json" hidden>
<input type="file" id="rosterInput" accept=".json" hidden>
<script src="data.js"></script><script src="app.js"></script>
</body>
</html>
